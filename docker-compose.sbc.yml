# docker-compose.sbc.yml — Local SBC Lab Extension
#
# Adds Kamailio SBC simulator and a softphone-friendly FreeSWITCH
# profile for mobile/laptop SIP registration with audio.
#
# Usage:
#   export EXT_IP=$(ipconfig getifaddr en0)
#   docker compose -f docker-compose.sip.yml -f docker-compose.sbc.yml up -d
#
# Or:
#   make sbc-lab
#
# Softphone config:
#   SIP server: <LAN_IP>  Port: 5090  Transport: TCP
#   Username: customer1   Password: 1234

services:
  kamailio:
    build: sbc/
    ports:
      - "5080:5060/udp"
      - "5080:5060/tcp"
    environment:
      - EXT_IP=${EXT_IP}
    depends_on:
      - freeswitch
    restart: unless-stopped

  freeswitch:
    ports:
      - "5090:5090/tcp"
      - "5090:5090/udp"
    environment:
      - EXT_IP=${EXT_IP}
      - EXTERNAL_RTP_IP=${EXT_IP}
      - EXTERNAL_SIP_IP=${EXT_IP}
    volumes:
      - ./freeswitch/config/sip_profiles/softphone.xml:/usr/local/freeswitch/conf/sip_profiles/softphone.xml:ro
      - ./freeswitch/config/directory/softphone-domain.xml:/usr/local/freeswitch/conf/directory/softphone-domain.xml:ro
      - ./freeswitch/config/dialplan/public-sbc-lab.xml:/usr/local/freeswitch/conf/dialplan/public.xml:ro
