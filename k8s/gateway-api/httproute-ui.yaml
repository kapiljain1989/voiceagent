apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ui
  namespace: voiceagent
spec:
  parentRefs:
    - name: voiceagent-gateway
  hostnames:
    - "voiceagent.local"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: ui
          port: 3000
