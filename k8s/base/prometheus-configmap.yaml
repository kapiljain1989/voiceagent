apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: voiceagent
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: 'voiceagent-gateway'
        static_configs:
          - targets: ['media-gateway.voiceagent.svc.cluster.local:8080']
        metrics_path: '/metrics'
        scrape_interval: 5s

      - job_name: 'envoy-stats'
        metrics_path: '/stats/prometheus'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: ['voiceagent']
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_container_name]
            action: keep
            regex: istio-proxy
          - source_labels: [__address__]
            action: replace
            regex: (.+):(\d+)
            replacement: $1:15090
            target_label: __address__
