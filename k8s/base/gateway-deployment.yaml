apiVersion: apps/v1
kind: Deployment
metadata:
  name: media-gateway
  labels:
    app: media-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: media-gateway
  template:
    metadata:
      labels:
        app: media-gateway
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      containers:
        - name: gateway
          image: voiceagent/gateway:latest
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: sip-udp
              containerPort: 5062
              hostPort: 5062
              protocol: UDP
            - name: sip-tcp
              containerPort: 5062
              hostPort: 5062
              protocol: TCP
          env:
            - name: LISTEN_ADDR
              value: ":8080"
            - name: VOICEAGENT_MODE
              value: "standalone"
            - name: SIP_LISTEN_ADDR
              value: ":5062"
            - name: EXTERNAL_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: STT_URL
              value: "http://whisper.voiceagent.svc.cluster.local:8000/v1/audio/transcriptions"
            - name: GCP_PROJECT_ID
              valueFrom:
                configMapKeyRef:
                  name: gcp-config
                  key: project-id
            - name: GCP_REGION
              valueFrom:
                configMapKeyRef:
                  name: gcp-config
                  key: region
            - name: CLAUDE_MODEL
              value: "claude-3-5-haiku@20241022"
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: "/secrets/gcp/key.json"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: password
            - name: DATABASE_URL
              value: "postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres.voiceagent.svc.cluster.local:5432/voiceagent?sslmode=disable"
            - name: REDIS_URL
              value: "redis://redis.voiceagent.svc.cluster.local:6379/0"
            - name: CHROMA_URL
              value: "http://chromadb.voiceagent.svc.cluster.local:8000"
            - name: AUTH_ENABLED
              value: "true"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: gateway-jwt-secret
                  key: jwt-secret
          volumeMounts:
            - name: gcp-credentials
              mountPath: /secrets/gcp
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: gcp-credentials
          secret:
            secretName: gcp-credentials
