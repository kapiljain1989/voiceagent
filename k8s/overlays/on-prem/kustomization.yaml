apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# On-premises deployment overlay
# Deploys into an enterprise data center with:
# - Private SIP trunk to Cisco CUBE / AudioCodes SBC
# - Istio service mesh with STRICT mTLS
# - MetalLB for FreeSWITCH LoadBalancer IP
# - Gateway API for HTTP/WebSocket ingress

namespace: voiceagent

resources:
  - ../../base
  - ../../istio
  - ../../gateway-api
  - metallb-config.yaml
  - freeswitch-lb-service.yaml

patches:
  - target:
      kind: Deployment
      name: media-gateway
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: DEPLOYMENT_MODE
          value: "on-prem"
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: SBC_PROFILE
          value: "cisco-cube"

  # FreeSWITCH: disable hostNetwork, use MetalLB LoadBalancer
  - target:
      kind: Deployment
      name: freeswitch
    patch: |
      - op: remove
        path: /spec/template/spec/hostNetwork
      - op: replace
        path: /spec/template/spec/dnsPolicy
        value: ClusterFirst
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "1Gi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "2"
