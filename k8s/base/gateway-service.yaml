apiVersion: v1
kind: Service
metadata:
  name: media-gateway
  namespace: voiceagent
spec:
  # ClusterIP is sufficient — only FreeSWITCH (in-cluster) connects here.
  type: ClusterIP
  selector:
    app: media-gateway
  ports:
    - name: ws
      port: 8080
      targetPort: 8080
      protocol: TCP
