apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gateway-api
  namespace: voiceagent
spec:
  parentRefs:
    - name: voiceagent-gateway
  hostnames:
    - "api.voiceagent.local"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /ws
      backendRefs:
        - name: media-gateway
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /siprec
      backendRefs:
        - name: media-gateway
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: media-gateway
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /healthz
      backendRefs:
        - name: media-gateway
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /metrics
      backendRefs:
        - name: media-gateway
          port: 8080
