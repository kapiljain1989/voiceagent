#!KAMAILIO
#
# Test SBC — External SBC simulator for VoiceAgent testing
#
# This is NOT part of VoiceAgent. It simulates an enterprise PBX/SBC
# that softphones register with and routes calls to the VoiceAgent gateway.
#
# Softphones register here, call any number → routed to VoiceAgent gateway.

debug=2
log_stderror=yes
fork=yes
children=4

listen=udp:0.0.0.0:5060
listen=tcp:0.0.0.0:5060

# Gateway address — where VoiceAgent listens for SIP
# Set GATEWAY_HOST env var to your Mac's IP running VoiceAgent
# e.g., GATEWAY_HOST=192.168.1.156
#!substdef "!GWHOST!__GATEWAY_HOST__!g"
#!substdef "!GWPORT!5062!g"

mpath="/usr/lib/kamailio/modules/"

loadmodule "kex.so"
loadmodule "tm.so"
loadmodule "tmx.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "pv.so"
loadmodule "maxfwd.so"
loadmodule "textops.so"
loadmodule "siputils.so"
loadmodule "xlog.so"
loadmodule "sanity.so"
loadmodule "usrloc.so"
loadmodule "registrar.so"

modparam("registrar", "default_expires", 3600)
modparam("registrar", "min_expires", 60)
modparam("registrar", "max_expires", 7200)
modparam("usrloc", "db_mode", 0)
modparam("rr", "enable_full_lr", 1)
modparam("rr", "append_fromtag", 1)
modparam("tm", "fr_timer", 5000)
modparam("tm", "fr_inv_timer", 30000)

request_route {
    if (!mf_process_maxfwd_header("10")) {
        sl_send_reply("483", "Too Many Hops");
        exit;
    }

    if (!sanity_check("1511", "7")) {
        xlog("L_WARN", "Malformed SIP from $si:$sp\n");
        exit;
    }

    force_rport();

    if (is_method("INVITE|SUBSCRIBE")) {
        record_route();
    }

    if (has_totag()) {
        if (loose_route()) {
            route(RELAY);
            exit;
        }
        if (is_method("ACK")) {
            if (t_check_trans()) {
                route(RELAY);
                exit;
            }
            exit;
        }
        sl_send_reply("404", "Not Found");
        exit;
    }

    if (is_method("CANCEL")) {
        if (t_check_trans()) { t_relay(); }
        exit;
    }

    t_check_trans();

    # REGISTER — accept all registrations (open SBC for testing)
    if (is_method("REGISTER")) {
        xlog("L_INFO", "REGISTER from $fU@$fd via $si:$sp\n");
        if (!save("location")) { sl_reply_error(); }
        exit;
    }

    if (is_method("OPTIONS")) {
        sl_send_reply("200", "OK");
        exit;
    }

    # INVITE — route ALL calls to VoiceAgent gateway
    if (is_method("INVITE")) {
        xlog("L_INFO", "INVITE from $fU to $rU → VoiceAgent GWHOST:GWPORT\n");
        $du = "sip:GWHOST:GWPORT;transport=udp";
        route(RELAY);
        exit;
    }

    route(RELAY);
}

route[RELAY] {
    if (!t_relay()) { sl_reply_error(); }
    exit;
}
