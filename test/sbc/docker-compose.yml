# Test SBC — External SBC simulator
#
# Usage:
#   GATEWAY_HOST=192.168.1.156 docker compose up -d
#
# Softphone config:
#   Server: <this-laptop-ip>:5060
#   Username: caller1 (any name)
#   Password: (empty)

services:
  sbc:
    build: .
    ports:
      - "5060:5060/udp"
      - "5060:5060/tcp"
    environment:
      - GATEWAY_HOST=${GATEWAY_HOST:-host.docker.internal}
