apiVersion: apps/v1
kind: Deployment
metadata:
  name: media-gateway
  namespace: voiceagent
  labels:
    app: media-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: media-gateway
  template:
    metadata:
      labels:
        app: media-gateway
    spec:
      containers:
        - name: gateway
          image: voiceagent/gateway:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
              protocol: TCP
          env:
            - name: LISTEN_ADDR
              value: ":8080"
            - name: STT_URL
              value: "http://whisper.voiceagent.svc.cluster.local:8000/v1/audio/transcriptions"
            - name: TTS_URL
              value: "http://piper.voiceagent.svc.cluster.local:5000"
            - name: GCP_PROJECT_ID
              valueFrom:
                configMapKeyRef:
                  name: gcp-config
                  key: project-id
            - name: GCP_REGION
              valueFrom:
                configMapKeyRef:
                  name: gcp-config
                  key: region
            - name: CLAUDE_MODEL
              value: "claude-3-5-haiku@20241022"
            - name: ESL_HOST
              value: "freeswitch.voiceagent.svc.cluster.local"
            - name: ESL_PORT
              value: "8022"
            - name: ESL_PASSWORD
              value: "ClueCon"
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: "/secrets/gcp/key.json"
          volumeMounts:
            - name: gcp-credentials
              mountPath: /secrets/gcp
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: gcp-credentials
          secret:
            secretName: gcp-credentials
