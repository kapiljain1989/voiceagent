# KinD cluster configuration for the AI Media Gateway.
#
# Networking model:
#   macOS host ──[docker port-map]──▶ KinD node container ──[hostNetwork pod]──▶ FreeSWITCH
#
# SIP clients on the host (or LAN) send to localhost:5060.
# Docker forwards that into the KinD node container, where the
# FreeSWITCH pod (hostNetwork:true) binds directly.
# RTP follows the same path over the 16000-16020 UDP port pool.
#
# The Go media gateway runs as a normal ClusterIP service — FreeSWITCH
# reaches it via K8s DNS (media-gateway.voiceagent.svc.cluster.local).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      # SIP signaling
      - containerPort: 5060
        hostPort: 5060
        protocol: UDP
      - containerPort: 5060
        hostPort: 5060
        protocol: TCP
      # RTP media — 21 ports for up to ~10 concurrent calls
      - containerPort: 16000
        hostPort: 16000
        protocol: UDP
      - containerPort: 16001
        hostPort: 16001
        protocol: UDP
      - containerPort: 16002
        hostPort: 16002
        protocol: UDP
      - containerPort: 16003
        hostPort: 16003
        protocol: UDP
      - containerPort: 16004
        hostPort: 16004
        protocol: UDP
      - containerPort: 16005
        hostPort: 16005
        protocol: UDP
      - containerPort: 16006
        hostPort: 16006
        protocol: UDP
      - containerPort: 16007
        hostPort: 16007
        protocol: UDP
      - containerPort: 16008
        hostPort: 16008
        protocol: UDP
      - containerPort: 16009
        hostPort: 16009
        protocol: UDP
      - containerPort: 16010
        hostPort: 16010
        protocol: UDP
      - containerPort: 16011
        hostPort: 16011
        protocol: UDP
      - containerPort: 16012
        hostPort: 16012
        protocol: UDP
      - containerPort: 16013
        hostPort: 16013
        protocol: UDP
      - containerPort: 16014
        hostPort: 16014
        protocol: UDP
      - containerPort: 16015
        hostPort: 16015
        protocol: UDP
      - containerPort: 16016
        hostPort: 16016
        protocol: UDP
      - containerPort: 16017
        hostPort: 16017
        protocol: UDP
      - containerPort: 16018
        hostPort: 16018
        protocol: UDP
      - containerPort: 16019
        hostPort: 16019
        protocol: UDP
      - containerPort: 16020
        hostPort: 16020
        protocol: UDP
      # ESL (optional — useful for debugging via fs_cli)
      - containerPort: 8021
        hostPort: 8021
        protocol: TCP
