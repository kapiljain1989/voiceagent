# KinD cluster configuration for VoiceAgent standalone mode.
#
# The gateway runs with hostNetwork:true and handles SIP/RTP directly.
# No FreeSWITCH needed — callers connect to the gateway's SIP port.
#
# Port mappings:
#   8080  → Gateway HTTP/WebSocket (via NodePort 30080)
#   3000  → UI (via NodePort 30030)
#   5062  → Gateway SIP (hostNetwork direct bind)
#   30000-30020 → RTP media pool (~10 concurrent calls)
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: voiceagent
nodes:
  - role: control-plane
    extraPortMappings:
      # Gateway HTTP (NodePort)
      - containerPort: 30080
        hostPort: 8080
        protocol: TCP
      # UI (NodePort)
      - containerPort: 30030
        hostPort: 3000
        protocol: TCP
      # Grafana (NodePort)
      - containerPort: 30090
        hostPort: 3001
        protocol: TCP
      # SIP signaling (gateway NodePort 30062 → host 5062)
      - containerPort: 30062
        hostPort: 5062
        protocol: UDP
      - containerPort: 30062
        hostPort: 5062
        protocol: TCP
      # RTP media pool
      - containerPort: 30000
        hostPort: 30000
        protocol: UDP
      - containerPort: 30002
        hostPort: 30002
        protocol: UDP
      - containerPort: 30004
        hostPort: 30004
        protocol: UDP
      - containerPort: 30006
        hostPort: 30006
        protocol: UDP
      - containerPort: 30008
        hostPort: 30008
        protocol: UDP
      - containerPort: 30010
        hostPort: 30010
        protocol: UDP
      - containerPort: 30012
        hostPort: 30012
        protocol: UDP
      - containerPort: 30014
        hostPort: 30014
        protocol: UDP
      - containerPort: 30016
        hostPort: 30016
        protocol: UDP
      - containerPort: 30018
        hostPort: 30018
        protocol: UDP
      - containerPort: 30020
        hostPort: 30020
        protocol: UDP
