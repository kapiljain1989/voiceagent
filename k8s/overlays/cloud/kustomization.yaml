apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: voiceagent

resources:
  - ../../base
  - ../../istio
  - ../../gateway-api
  - freeswitch-lb-service.yaml

patches:
  # FreeSWITCH: disable hostNetwork, use LoadBalancer instead
  - target:
      kind: Deployment
      name: freeswitch
    patch: |
      - op: remove
        path: /spec/template/spec/hostNetwork
      - op: replace
        path: /spec/template/spec/dnsPolicy
        value: ClusterFirst

  # Cloud images: pull from registry
  - target:
      kind: Deployment
      name: media-gateway
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always

  - target:
      kind: Deployment
      name: freeswitch
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always

  - target:
      kind: Deployment
      name: ui
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always

  # PVCs: cloud storage class
  - target:
      kind: PersistentVolumeClaim
      name: postgres-data
    patch: |
      - op: add
        path: /spec/storageClassName
        value: standard

  - target:
      kind: PersistentVolumeClaim
      name: chromadb-data
    patch: |
      - op: add
        path: /spec/storageClassName
        value: standard

  - target:
      kind: PersistentVolumeClaim
      name: prometheus-data
    patch: |
      - op: add
        path: /spec/storageClassName
        value: standard

  - target:
      kind: PersistentVolumeClaim
      name: grafana-data
    patch: |
      - op: add
        path: /spec/storageClassName
        value: standard
