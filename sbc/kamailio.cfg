#!KAMAILIO
#
# VoiceAgent Local SBC Lab — Kamailio Configuration
#
# Routes softphone calls to FreeSWITCH (VoiceAgent gateway).
# Supports registrar for mobile/laptop softphones, co-pilot
# bridging with SIPREC fork, and auto-answer mode.
#
# Dial plan:
#   1xxx  → AI Agent (FreeSWITCH interactive mode)
#   2xxx  → Co-Pilot bridge (customer ↔ agent) + SIPREC
#   21xx  → Co-Pilot auto-answer (FreeSWITCH answers agent leg)
#   3xxx  → Human queue (FreeSWITCH hold audio)

####### Global Parameters #########

debug=2
log_stderror=yes
fork=yes
children=4

listen=udp:0.0.0.0:5060
listen=tcp:0.0.0.0:5060

# Advertise LAN IP in SIP headers (set via EXT_IP env var)
#!substdef "!EXTIP!__EXT_IP__!g"
advertised_address=EXTIP
advertised_port=5060

# FreeSWITCH downstream target
#!substdef "!FSHOST!freeswitch!g"
#!substdef "!FSPORT!5060!g"

# VoiceAgent gateway (for SIPREC)
#!substdef "!GWHOST!gateway!g"
#!substdef "!GWPORT!8080!g"

mpath="/usr/lib/x86_64-linux-gnu/kamailio/modules/"

####### Modules Section ########

loadmodule "tm.so"
loadmodule "tmx.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "pv.so"
loadmodule "maxfwd.so"
loadmodule "textops.so"
loadmodule "siputils.so"
loadmodule "xlog.so"
loadmodule "sanity.so"
loadmodule "nathelper.so"
loadmodule "registrar.so"
loadmodule "usrloc.so"
loadmodule "dispatcher.so"

# Module parameters
modparam("registrar", "default_expires", 3600)
modparam("registrar", "min_expires", 60)
modparam("registrar", "max_expires", 7200)

modparam("usrloc", "db_mode", 0)

modparam("nathelper", "natping_interval", 30)
modparam("nathelper", "ping_nated_only", 1)
modparam("nathelper", "sipping_bflag", 7)
modparam("nathelper", "sipping_from", "sip:keepalive@voiceagent.local")

modparam("dispatcher", "list_file", "/etc/kamailio/dispatcher.list")
modparam("dispatcher", "ds_ping_interval", 30)
modparam("dispatcher", "ds_probing_mode", 1)

modparam("rr", "enable_full_lr", 1)
modparam("rr", "append_fromtag", 1)

modparam("tm", "fr_timer", 5000)
modparam("tm", "fr_inv_timer", 30000)

####### Routing Logic ########

request_route {
    # Per-request initial checks
    if (!mf_process_maxfwd_header("10")) {
        sl_send_reply("483", "Too Many Hops");
        exit;
    }

    if (!sanity_check("1511", "7")) {
        xlog("L_WARN", "Malformed SIP message from $si:$sp\n");
        exit;
    }

    # NAT detection and fix
    if (nat_uac_test("19")) {
        if (is_method("REGISTER")) {
            fix_nated_register();
            setbflag(7);
        } else {
            fix_nated_contact();
            force_rport();
        }
    }

    # Record-Route for in-dialog requests
    if (is_method("INVITE|SUBSCRIBE")) {
        record_route();
    }

    # Handle sequential (in-dialog) requests
    if (has_totag()) {
        if (loose_route()) {
            if (is_method("BYE")) {
                xlog("L_INFO", "BYE in-dialog from $fU to $rU\n");
            }
            route(RELAY);
            exit;
        }
        if (is_method("ACK")) {
            if (t_check_trans()) {
                route(RELAY);
                exit;
            }
            exit;
        }
        sl_send_reply("404", "Not Found");
        exit;
    }

    # Handle CANCEL
    if (is_method("CANCEL")) {
        if (t_check_trans()) {
            t_relay();
        }
        exit;
    }

    # Absorb retransmissions
    t_check_trans();

    # REGISTER — accept softphone registrations
    if (is_method("REGISTER")) {
        xlog("L_INFO", "REGISTER from $fU@$fd via $si:$sp\n");
        if (!save("location")) {
            sl_reply_error();
        }
        exit;
    }

    # OPTIONS keepalive
    if (is_method("OPTIONS")) {
        sl_send_reply("200", "OK");
        exit;
    }

    # INVITE routing
    if (is_method("INVITE")) {
        route(ROUTE_CALLS);
        exit;
    }

    # Everything else → relay if we know the destination
    if ($rU == $null) {
        sl_send_reply("484", "Address Incomplete");
        exit;
    }

    route(RELAY);
}

# ─── Call routing based on destination number ───────────────────

route[ROUTE_CALLS] {
    xlog("L_INFO", "INVITE from $fU to $rU\n");

    # 1xxx → Interactive AI Agent (FreeSWITCH)
    if ($rU =~ "^1[0-9]{3}$") {
        xlog("L_INFO", "Routing to AI Agent: $rU\n");
        $du = "sip:FSHOST:FSPORT;transport=udp";
        route(RELAY);
        exit;
    }

    # 21xx → Co-Pilot auto-answer (FreeSWITCH answers agent leg)
    if ($rU =~ "^21[0-9]{2}$") {
        xlog("L_INFO", "Routing to Co-Pilot auto-answer: $rU\n");
        $du = "sip:FSHOST:FSPORT;transport=udp";
        route(RELAY);
        exit;
    }

    # 2xxx → Co-Pilot bridge (customer ↔ registered agent)
    if ($rU =~ "^2[0-9]{3}$") {
        xlog("L_INFO", "Routing to Co-Pilot bridge: $rU\n");

        # Try to find agent1 in location table
        if (lookup("location", "sip:agent1@EXTIP")) {
            xlog("L_INFO", "Agent found, bridging call\n");
            route(RELAY);
            exit;
        }

        # No agent registered — fall back to FreeSWITCH auto-answer
        xlog("L_INFO", "No agent registered, falling back to FreeSWITCH\n");
        $du = "sip:FSHOST:FSPORT;transport=udp";
        route(RELAY);
        exit;
    }

    # 3xxx → Human queue (FreeSWITCH hold audio)
    if ($rU =~ "^3[0-9]{3}$") {
        xlog("L_INFO", "Routing to Human Queue: $rU\n");
        $du = "sip:FSHOST:FSPORT;transport=udp";
        route(RELAY);
        exit;
    }

    # Unknown destination
    sl_send_reply("404", "No Route");
    exit;
}

# ─── Relay ──────────────────────────────────────────────────────

route[RELAY] {
    if (!t_relay()) {
        sl_reply_error();
    }
    exit;
}

# ─── Reply route — NAT fix for responses ───────────────────────

onreply_route {
    if (nat_uac_test("1")) {
        fix_nated_contact();
    }
}

# ─── Failure route — handle call failures ──────────────────────

failure_route[FAIL_ROUTE] {
    if (t_is_canceled()) {
        exit;
    }

    xlog("L_WARN", "Call failed: $rU status $T_reply_code\n");

    # On 5xx/6xx from FreeSWITCH, try human queue
    if (t_check_status("5[0-9][0-9]|6[0-9][0-9]")) {
        xlog("L_WARN", "Failover to human queue 3000\n");
        $rU = "3000";
        $du = "sip:FSHOST:FSPORT;transport=udp";
        t_relay();
        exit;
    }
}
