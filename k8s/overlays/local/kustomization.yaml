apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: voiceagent

resources:
  - ../../base

patchesStrategicMerge:
  - gateway-hostnetwork.yaml

patches:
  # Custom images: imagePullPolicy=Never (preloaded via kind load)
  - target:
      kind: Deployment
      name: media-gateway
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never

  - target:
      kind: Deployment
      name: ui
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
