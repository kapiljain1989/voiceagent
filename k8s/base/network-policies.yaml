apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gateway
  namespace: voiceagent
spec:
  podSelector:
    matchLabels:
      app: media-gateway
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: freeswitch
        - podSelector:
            matchLabels:
              app: ui
        - podSelector:
            matchLabels:
              app: prometheus
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-system
      ports:
        - port: 8080
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-freeswitch
  namespace: voiceagent
spec:
  podSelector:
    matchLabels:
      app: freeswitch
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: media-gateway
      ports:
        - port: 8022
          protocol: TCP
    - ports:
        - port: 5060
          protocol: UDP
        - port: 5060
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
