apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Air-gapped deployment — zero internet access
# All AI models run locally. No Vertex AI dependency.
# Uses local Ollama for LLM instead of Claude/Gemini.
# Istio mesh for mTLS, no external ServiceEntries.

namespace: voiceagent

resources:
  - ../../base
  - ../../istio
  - ../../gateway-api

patches:
  - target:
      kind: Deployment
      name: media-gateway
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: DEPLOYMENT_MODE
          value: "air-gapped"
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: ENABLE_AIRGAP
          value: "true"
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: LLM_PROVIDER
          value: "ollama"
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: OLLAMA_URL
          value: "http://ollama:11434"

  # FreeSWITCH: hostNetwork for air-gapped environments
  - target:
      kind: Deployment
      name: freeswitch
    patch: |
      - op: replace
        path: /spec/template/spec/hostNetwork
        value: true
      - op: replace
        path: /spec/template/spec/dnsPolicy
        value: ClusterFirstWithHostNet
