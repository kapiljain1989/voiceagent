---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-gateway
  namespace: voiceagent
spec:
  selector:
    matchLabels:
      app: media-gateway
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - "cluster.local/ns/voiceagent/sa/default"
        - source:
            namespaces: ["istio-system"]
      to:
        - operation:
            ports: ["8080"]
    - from:
        - source:
            notPrincipals: ["_"]
      to:
        - operation:
            ports: ["8080"]
            paths: ["/ws", "/siprec*", "/healthz", "/metrics"]
---
