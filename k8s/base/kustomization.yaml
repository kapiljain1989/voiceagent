apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: voiceagent

resources:
  - namespace.yaml
  # Gateway (standalone SIP B2BUA)
  - gateway-deployment.yaml
  - gateway-service.yaml
  # STT
  - whisper-deployment.yaml
  - whisper-service.yaml
  - whisper-headless-service.yaml
  # TTS
  - piper-deployment.yaml
  - piper-service.yaml
  # Data stores
  - postgres-deployment.yaml
  - postgres-service.yaml
  - postgres-pvc.yaml
  - postgres-secret.yaml
  - redis-deployment.yaml
  - redis-service.yaml
  - chromadb-deployment.yaml
  - chromadb-service.yaml
  - chromadb-pvc.yaml
  # UI
  - ui-deployment.yaml
  - ui-service.yaml
  # Observability
  - prometheus-deployment.yaml
  - prometheus-service.yaml
  - prometheus-configmap.yaml
  - prometheus-pvc.yaml
  - grafana-deployment.yaml
  - grafana-service.yaml
  - grafana-pvc.yaml
  - grafana-secret.yaml
  # Configuration
  - gcp-configmap.yaml
  - gateway-jwt-secret.yaml
  # Network policies (disabled for local dev — enable for production)
  # - network-policies.yaml
